spring.application.name=hospital-management

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- Add these lines below to fix your build ---

# 1. Explicitly set the PostgreSQL Dialect so it doesn't crash if metadata lookup fails
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 2. Restrict the maximum connections to fit safely within Aiven's 20-connection free limit
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000